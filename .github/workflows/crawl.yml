name: Crawl Lottery Results

on:
  schedule:
    # 16:45 - 18:45 VN time (= 09:45 - 11:45 UTC) every 15 minutes
    - cron: '45 9 * * *'
    - cron: '0,15,30,45 10,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lottery crawler
        run: python scripts/crawl.py

      - name: Commit and push changes if results changed
        run: |
          if ! git diff --quiet data/results.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "chore: update lottery results [skip ci]"
            git push
          else
            echo "No changes in data/results.json"
          fi

