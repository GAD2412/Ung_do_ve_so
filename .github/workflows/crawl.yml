name: Crawl Lottery Results

on:
  schedule:
    # 16:15 - 18:55 VN time (= 09:15 - 11:55 UTC) every 5 minutes during drawing hours
    - cron: '15,20,25,30,35,40,45,50,55 9 * * *'
    - cron: '*/5 10,11 * * *'
    # 19:00 - 19:45 VN time (= 12:00 - 12:45 UTC) every 15 minutes for late updates
    - cron: '0,15,30,45 12 * * *'
    # Fallback runs at 21:00 and 23:00 VN time (= 14:00 and 16:00 UTC)
    - cron: '0 14,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lottery crawler
        run: python scripts/crawl.py

      - name: Commit and push changes if results changed
        run: |
          if ! git diff --quiet data/results.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "chore: update lottery results [skip ci]"
            git push
          else
            echo "No changes in data/results.json"
          fi
