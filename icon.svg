<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Ticket Card with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Slanted Ticket Card -->
    <path d="M 120 160 
             C 120 142, 134 128, 152 128 
             L 360 128 
             C 378 128, 392 142, 392 160 
             L 392 236 
             A 20 20 0 0 0 392 276 
             L 392 352 
             C 392 370, 378 384, 360 384 
             L 152 384 
             C 134 384, 120 370, 120 352 
             L 120 276 
             A 20 20 0 0 0 120 236 
             Z" 
          fill="url(#cardGrad)" />
  </g>

  <!-- Ticket Header Bar -->
  <path d="M 120 160 C 120 142, 134 128, 152 128 L 360 128 C 378 128, 392 142, 392 160 L 392 196 L 120 196 Z" fill="url(#goldGrad)" />
  
  <!-- Perforation Line -->
  <line x1="130" y1="256" x2="382" y2="256" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Golden Lucky Star in Header -->
  <polygon points="256,140 263,156 280,158 268,170 271,186 256,177 241,186 244,170 232,158 249,156" fill="#991b1b" />

  <!-- Lucky Numbers Symbol on Ticket -->
  <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="4">888 · 999</text>

  <!-- Big Red Ball / Clover with Gold Rim in Lower Section -->
  <circle cx="256" cy="320" r="38" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <text x="256" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#fef08a" text-anchor="middle">ĐB</text>

  <!-- Sparkles -->
  <path d="M 104 104 L 110 120 L 126 126 L 110 132 L 104 148 L 98 132 L 82 126 L 98 120 Z" fill="url(#goldGrad)" />
  <path d="M 400 370 L 405 382 L 417 387 L 405 392 L 400 404 L 395 392 L 383 387 L 395 382 Z" fill="url(#goldGrad)" />
</svg>
